name: build-wasm
# Build a user RTL design to WebAssembly (Verilator -> emcc) on a GitHub-hosted runner
# and publish it to docs/wasm/run/<top>/ so it runs client-side on www.xhardtech.com.
# Public repo => unlimited minutes; ephemeral runner => sandboxed compile of untrusted RTL.
#
# This is the "link a GitHub repo -> run the design" flow. Trigger via the Actions UI
# (workflow_dispatch) or a repository_dispatch of type `build-wasm`.
#
# SINGLE-FILE design (unchanged):     repo + top [+ rtl=path/to/<top>.v]
# MULTI-FILE design (e.g. a CPU):     repo + top + ONE of
#     srcdir=<dir>      all *.v / *.sv in that repo dir are compiled together, or
#     filelist=<x.f>    a Verilator-style .f list (one path per line, # comments ok), or
#     rtl=<.v|dir|.f>   shorthand that auto-detects which of the three it is.
# Memory-init: $readmemh/$readmemb data (e.g. a program ROM .hex) is auto-detected and
#     embedded into the wasm FS; override the set with `hex=...` and its dir with `memdir=`.
#
# Worked example (real upstream SERV, github.com/olofk/serv):
#     repo=https://github.com/olofk/serv  top=<your top>  srcdir=rtl  hex=<prog>.hex
# olofk/serv ships only the core in rtl/ (no top with a clock/GPIO and no program ROM),
# so to run it you also need a small top wrapper + an assembled program in the repo --
# exactly what our serv_blink_wasm.v + count32.hex provide. See docs/wasm/run/SERV_DEMO.md.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'design git repo (https github/gitlab)'
        required: true
      top:
        description: 'top module name'
        required: true
      rtl:
        description: 'RTL inside the repo: a single .v, OR a directory of .v, OR a .f source-list (default <top>.v). Shorthand; for multi-file designs prefer srcdir/filelist below.'
        required: false
        default: ''
      srcdir:
        description: 'MULTI-FILE: directory in the repo whose *.v / *.sv are all compiled (e.g. rtl or serv/rtl). Takes precedence over rtl.'
        required: false
        default: ''
      filelist:
        description: 'MULTI-FILE: a .f source-list file in the repo (one path per line, # comments ok; paths relative to the .f dir). Takes precedence over rtl/srcdir.'
        required: false
        default: ''
      hex:
        description: 'optional space-separated $readmemh/$readmemb data files (e.g. a program ROM hex); paths relative to memdir. Auto-detected from the RTL if blank.'
        required: false
        default: ''
      memdir:
        description: 'directory the hex/mem data files are looked up in (default: directory of the source set). Use when your hex lives apart from the RTL.'
        required: false
        default: ''
  repository_dispatch:
    types: [build-wasm]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        run: |
          echo "REPO=${{ github.event.inputs.repo || github.event.client_payload.repo }}" >> "$GITHUB_ENV"
          echo "TOP=${{ github.event.inputs.top || github.event.client_payload.top }}"     >> "$GITHUB_ENV"
          echo "RTL=${{ github.event.inputs.rtl || github.event.client_payload.rtl }}"     >> "$GITHUB_ENV"
          echo "SRCDIR=${{ github.event.inputs.srcdir || github.event.client_payload.srcdir }}"     >> "$GITHUB_ENV"
          echo "FILELIST=${{ github.event.inputs.filelist || github.event.client_payload.filelist }}" >> "$GITHUB_ENV"
          # `hex` is the new preferred name; accept legacy `memfiles` too. `memdir` is optional.
          echo "MEMFILES=${{ github.event.inputs.hex || github.event.client_payload.hex || github.event.inputs.memfiles || github.event.client_payload.memfiles }}" >> "$GITHUB_ENV"
          echo "MEMDIR_IN=${{ github.event.inputs.memdir || github.event.client_payload.memdir }}" >> "$GITHUB_ENV"

      - name: Validate inputs
        run: |
          echo "$REPO" | grep -E '^https://(github\.com|gitlab\.com)/[A-Za-z0-9._/-]+$' || { echo "repo must be a github/gitlab https URL"; exit 1; }
          echo "$TOP"  | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || { echo "bad top name"; exit 1; }

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator

      - name: Patch Verilator for wasm32 (VL_CPU_RELAX arch gap)
        run: |
          H=/usr/share/verilator/include/verilatedos.h
          sudo sed -i 's@# *error "Missing VL_CPU_RELAX() definition\."@# define VL_CPU_RELAX()@' "$H"
          grep -n "VL_CPU_RELAX" "$H" | tail -3

      - uses: mymindstorm/setup-emsdk@v14

      - name: Clone design (shallow, no submodules)
        run: |
          rm -rf /tmp/design
          GIT_TERMINAL_PROMPT=0 timeout 60 git clone --depth 1 --no-recurse-submodules "$REPO" /tmp/design
          du -sh /tmp/design | awk '{print "design size:",$1}'

      - name: Security scan
        run: bash tools/wasm/scan_rtl.sh /tmp/design

      - name: Resolve RTL source set
        run: |
          # build_wasm_any.sh accepts a SINGLE .v, a DIRECTORY of *.v/*.sv (multi-file), or a
          # .f source-list (multi-file). We pick the source set in this precedence order:
          #   filelist (.f)  >  srcdir (dir)  >  rtl (shorthand: .v|dir|.f)  >  default <top>.v
          if   [ -n "$FILELIST" ]; then SRC="/tmp/design/$FILELIST"
          elif [ -n "$SRCDIR"   ]; then SRC="/tmp/design/$SRCDIR"
          elif [ -n "$RTL"      ]; then SRC="/tmp/design/$RTL"
          else
            # AUTO-DETECT: a Chisel source set (*.scala anywhere, ignoring sbt/mill build dirs)
            # wins; otherwise the conventional <top>.v. Lets a user point at a Chisel repo with
            # no rtl=... and we find the sources ourselves.
            SCALA1="$(find /tmp/design -name '*.scala' -not -path '*/project/*' -not -path '*/target/*' | head -1)"
            if [ -n "$SCALA1" ]; then SRC="/tmp/design"; echo "auto-detected Chisel sources under /tmp/design";
            else SRC="$(find /tmp/design -name "${TOP}.v" | head -1)"; fi
          fi
          { [ -f "$SRC" ] || [ -d "$SRC" ]; } || { echo "RTL not found: set rtl=<.v|.scala>, srcdir=<dir>, or filelist=<.f>; '$SRC' missing"; exit 1; }
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          # Flag Chisel so the next step installs scala-cli only when needed.
          if echo "$SRC" | grep -q '\.scala$' || { [ -d "$SRC" ] && find "$SRC" -name '*.scala' -not -path '*/project/*' -not -path '*/target/*' | grep -q .; }; then
            echo "CHISEL=1" >> "$GITHUB_ENV"; echo "Chisel design detected"
          fi
          echo "resolved source set -> $SRC"
          [ -d "$SRC" ] && { echo "  *.v/*.sv in dir:"; find "$SRC" -maxdepth 1 \( -name '*.v' -o -name '*.sv' \) | sort | sed 's/^/    /'; }
          # MEMDIR: where $readmemh/$readmemb data files are looked up. Explicit `memdir` input
          # wins; else the dir of the source set (the dir itself, or the .f/.v file's dir).
          if   [ -n "$MEMDIR_IN" ]; then echo "MEMDIR=/tmp/design/$MEMDIR_IN" >> "$GITHUB_ENV"
          elif [ -d "$SRC"       ]; then echo "MEMDIR=$SRC"              >> "$GITHUB_ENV"
          else                           echo "MEMDIR=$(dirname "$SRC")" >> "$GITHUB_ENV"
          fi

      - name: Setup Chisel toolchain (scala-cli) — only for Chisel designs
        if: env.CHISEL == '1'
        run: |
          # A Chisel design elaborates Scala -> SystemVerilog (firtool) before Verilator. JDK is
          # preinstalled on ubuntu-latest; we add scala-cli, which auto-resolves Chisel + firtool.
          # This is exactly the rocket-chip-style flow (sbt/FIRRTL -> Verilog -> Verilator), scaled
          # to designs that fit a browser-WASM sim. (No Verilator/emcc here — those run below.)
          echo "Chisel design -> installing scala-cli"
          curl -fsSL https://github.com/VirtusLab/scala-cli/releases/download/v1.5.0/scala-cli-x86_64-pc-linux.gz | gunzip > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli
          java -version
          /usr/local/bin/scala-cli version || true

      - name: Build WASM
        run: |
          OUT="docs/wasm/run/${TOP}"
          rm -rf "$OUT"; mkdir -p "$OUT"
          # MEMFILES (if set) and MEMDIR are read from the env by the build script; blank MEMFILES
          # triggers auto-detection of $readmemh/$readmemb literals from the RTL.
          MEMFILES="$MEMFILES" MEMDIR="$MEMDIR" bash tools/wasm/build_wasm_any.sh "$SRC" "$TOP" "$OUT"
          # keep only the publishable artifacts (the $readmemh data is embedded INTO the wasm)
          find "$OUT" -mindepth 1 ! -name "V${TOP}.mjs" ! -name "V${TOP}.wasm" ! -name "${TOP}.config.json" -prune -exec rm -rf {} +
          ls -la "$OUT"

      - name: Publish to Pages
        run: |
          git config user.name  "xhardtech-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "docs/wasm/run/${TOP}"
          git commit -m "wasm(actions): build ${TOP} from ${REPO}" || { echo "no change"; exit 0; }
          git push
          echo "LIVE: https://www.xhardtech.com/wasm/run/runner.html?top=${TOP}&base=/wasm/run/${TOP}"
